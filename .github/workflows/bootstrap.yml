name: Bootstrap TavoLink Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Current repository:"
          ls -lah

      - name: Unpack TavoLink package
        run: |
          rm -rf /tmp/tavolink_unpack
          mkdir -p /tmp/tavolink_unpack

          unzip -q TavoLink-YunZhao-v1.1.0-GitHub-AutoBuild.zip \
            -d /tmp/tavolink_unpack

          cp -a \
            /tmp/tavolink_unpack/TavoLink-YunZhao-GitHub-Build-v1.1.0/. \
            .

          rm -rf /tmp/tavolink_unpack
          rm -f TavoLink-YunZhao-v1.1.0-GitHub-AutoBuild.zip

          echo "Project extracted:"
          ls -la

          echo "Workflows:"
          find .github/workflows -maxdepth 1 -type f -print || true

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat: bootstrap TavoLink YunZhao v1.1.0"
            git push
          fi
