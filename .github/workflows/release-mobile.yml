name: Build TavoLink APK + IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  android-release:
    name: Android · Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve app version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure optional Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING_MODE="debug-fallback"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_STORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
            SIGNING_MODE="upload-key"
          fi
          echo "ANDROID_SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: Protocol and learning contracts
        run: |
          python3 tool/source_selfcheck.py
          python3 tool/runtime_contract_test.py
          python3 tool/learning_contract_test.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare Android artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TavoLink-YunZhao-${APP_VERSION}.apk"
          printf 'signing=%s\ncommit=%s\n' "$ANDROID_SIGNING_MODE" "$GITHUB_SHA" > "dist/TavoLink-YunZhao-${APP_VERSION}-signing.txt"
          cd dist
          sha256sum "TavoLink-YunZhao-${APP_VERSION}.apk" > "TavoLink-YunZhao-${APP_VERSION}.apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavoLink-YunZhao-Android-${{ env.APP_VERSION }}
          path: |
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}.apk
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}.apk.sha256
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}-signing.txt
          if-no-files-found: error
          retention-days: 90

  ios-release:
    name: iOS · Unsigned IPA + Optional Signed IPA
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_BUNDLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve app version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p build/unsigned_ipa/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/
          (cd build/unsigned_ipa && zip -qry "../../dist/TavoLink-YunZhao-${APP_VERSION}-unsigned.ipa" Payload)
          cd dist
          shasum -a 256 "TavoLink-YunZhao-${APP_VERSION}-unsigned.ipa" > "TavoLink-YunZhao-${APP_VERSION}-unsigned.ipa.sha256"

      - name: Explain unsigned-only build
        if: env.HAS_IOS_SIGNING != 'true'
        run: echo "Apple signing secrets are not configured; the verified unsigned IPA will be published."

      - name: Install optional Apple signing identity
        if: env.HAS_IOS_SIGNING == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tavolink-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/tavolink-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/tavolink.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/tavolink-profile.plist"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          RUNNER_USER_DIR="${RUNNER_TEMP%/work/_temp}"
          PROFILE_DIR="$RUNNER_USER_DIR/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=$IOS_BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Build optional signed IPA
        if: env.HAS_IOS_SIGNING == 'true'
        shell: bash
        env:
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          EXPORT_METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
          EXPORT_OPTIONS="$RUNNER_TEMP/TavoLink-ExportOptions.plist"

          IOS_BUNDLE_ID="$IOS_BUNDLE_ID" perl -0pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.tavolink\.tavolink;/PRODUCT_BUNDLE_IDENTIFIER = $ENV{IOS_BUNDLE_ID};/g' ios/Runner.xcodeproj/project.pbxproj
          IOS_TEAM_ID="$IOS_TEAM_ID" IOS_PROFILE_NAME="$IOS_PROFILE_NAME" perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{IOS_TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{IOS_PROFILE_NAME}";/g' ios/Runner.xcodeproj/project.pbxproj

          plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string $EXPORT_METHOD" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_NAME" "$EXPORT_OPTIONS"

          flutter clean
          flutter pub get --enforce-lockfile
          flutter build ipa --release --export-options-plist="$EXPORT_OPTIONS"
          cp build/ios/ipa/*.ipa "dist/TavoLink-YunZhao-${APP_VERSION}-signed.ipa"
          cd dist
          shasum -a 256 "TavoLink-YunZhao-${APP_VERSION}-signed.ipa" > "TavoLink-YunZhao-${APP_VERSION}-signed.ipa.sha256"

      - name: Remove temporary Apple keychain
        if: always() && env.HAS_IOS_SIGNING == 'true'
        run: security delete-keychain "$IOS_KEYCHAIN_PATH" || true

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TavoLink-YunZhao-iOS-${{ env.APP_VERSION }}
          path: |
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}-unsigned.ipa
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}-unsigned.ipa.sha256
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}-signed.ipa
            dist/TavoLink-YunZhao-${{ env.APP_VERSION }}-signed.ipa.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TavoLink-YunZhao-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.ipa
            release-assets/*.sha256
            release-assets/*-signing.txt
