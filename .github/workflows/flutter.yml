name: TavoLink Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  android-quality:
    name: Android · Analyze + Test + Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify committed native projects
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f ios/Runner/Info.plist

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Normalize and persist Dart formatting
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          dart format lib test
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply Dart formatter"
          git push origin HEAD:main

      - name: Verify Dart formatting on pull requests
        if: github.event_name == 'pull_request'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: Protocol and learning contracts
        run: |
          python3 tool/source_selfcheck.py
          python3 tool/runtime_contract_test.py
          python3 tool/learning_contract_test.py

      - name: Android debug build
        run: flutter build apk --debug

  ios-quality:
    name: iOS · Analyze + Test + Simulator Build
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify committed native projects
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f ios/Runner/Info.plist

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: iOS simulator build
        run: flutter build ios --simulator --debug

      - name: Launch app and capture iOS simulator screenshot
        shell: bash
        run: |
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
                  text=True,
              )
          )
          for runtime_devices in payload['devices'].values():
              for device in runtime_devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator found')
          PY
          )"

          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          READY=false
          for attempt in {1..90}; do
            STATE="$(DEVICE_ID="$DEVICE_ID" python3 - <<'PY'
          import json
          import os
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ['xcrun', 'simctl', 'list', 'devices', '-j'],
                  text=True,
              )
          )
          target = os.environ['DEVICE_ID']
          for runtime_devices in payload['devices'].values():
              for device in runtime_devices:
                  if device['udid'] == target:
                      print(device['state'])
                      raise SystemExit(0)
          raise SystemExit('Selected iPhone simulator disappeared')
          PY
            )"
            if [[ "$STATE" == "Booted" ]]; then
              READY=true
              break
            fi
            sleep 2
          done
          [[ "$READY" == "true" ]]

          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE_ID" com.tavolink.tavolink
          sleep 8

          mkdir -p dist
          xcrun simctl io "$DEVICE_ID" screenshot \
            dist/TavoLink-YunZhao-iOS-Simulator.png
          test -s dist/TavoLink-YunZhao-iOS-Simulator.png

      - name: Upload iOS runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TavoLink-YunZhao-iOS-Runtime-Screenshot
          path: dist/TavoLink-YunZhao-iOS-Simulator.png
          if-no-files-found: error
          retention-days: 90
