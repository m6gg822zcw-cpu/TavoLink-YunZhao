name: tavolink
description: Tavo-first mobile MCP client with the YunZhao fox-spirit agent for Android and iOS.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/yunzhao_hero_v2.png
    - assets/images/yunzhao_concept.jpg
